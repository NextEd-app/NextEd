\\\x22, \\\x22二\\\x22, \\\x22三\\\x22, \\\x22四\\\x22, \\\x22五\\\x22, \\\x22六\\\x22\x5d,\\n            suffixSched: \\\x22 課表\\\x22, selectPrompt: \\\x22選擇...\\\x22, customGroupLabel: \\\x22✏️ 自訂科目\\\x22\\n        \x7d\\n    \x7d;\\n\\n    const triviaData \x3d \x7b\\n        ja: \x5b\\\x22シャープペンの芯の「H」はHard（硬い）、「B」はBlack（黒い）の略である。\\\x22,\\n        \\\x22日本で一番多い学校の名前は「第一小学校」である。\\\x22,\\n        \\\x22黒板が緑色なのに「黒板」と呼ぶのは、昔は本当に黒い板を使っていたから。\\\x22,\\n        \\\x22ことわざ「情けは人のためならず」は、「人に親切にすれば、巡り巡って自分に良いことが返ってくる」という意味である。\\\x22,\\n        \\\x22世界で一番最初に作られた自動販売機で売られていたのは「聖水」である。\\\x22,\\n        \\\x22アイスクリームには賞味期限がない（冷凍保存なら品質が劣化しにくいため）。\\\x22,\\n        \\\x22納豆は、朝より夜に食べた方が血液サラサラ効果がアップする\\\x22,\\n        \\\x22熱々のご飯に納豆をかけると納豆の栄養効果が下がる\\\x22,\\n        \\\x22歯を磨く時、歯ブラシは濡らさない方がより綺麗に磨ける\\\x22,\\n        \\\x22服についたカレーの染みは、天日干しをするだけで綺麗に落ちる\\\x22,\\n        \\\x22ご飯は冷たいまま食べた方が太りづらい\\\x22,\\n        \\\x22食後にグラス一杯の水を飲むと、胃酸の逆流を抑えることができる\\\x22,\\n        \\\x22喉が痛い時はマシュマロを食べると痛みが和らぐ\\\x22,\\n        \\\x22スマホの充電は100%にせず80%程度で止めると長持ちする\\\x22,\\n        \\\x22虫刺されに酢をかけると痒みや炎症が和らぐ\\\x22,\\n        \\\x22しゃっくりが止まらない時は、指で両耳を塞ぐと止まりやすい\\\x22,\\n        \\\x22ポテトチップスは着火剤の代わりになる\\\x22,\\n        \\\x22頭痛がなかなか治らない時は、手足を温めると症状が楽になる\\\x22,\\n        \\\x22同じ運動でも、夏より冬の方が消費カロリーが高い\\\x22,\\n        \\\x22赤ちゃんが泣き止まない時は、反町隆史のPOISONを聴かせると泣き止む\\\x22,\\n        \\\x22連載当初、ドラえもんはどら焼きではなく餅が好きだった\\\x22,\\n        \\\x22マリオがジャンプして壊しているブロックは、クッパによって姿を変えられたキノコ王国の住民\\\x22,\\n        \\\x22サザエさんのエンディングの曲は3番目の歌詞\\\x22,\\n        \\\x22サザエさんは新年一発目のジャンケンは30年連続でチョキを出している\\\x22,\\n        \\\x22ジャイアンの名言「お前の物は俺の物、俺の物も俺の物」はイギリスのことわざ\\\x22,\\n        \\\x22ゲゲゲの鬼太郎の目玉のオヤジは目を閉じて寝る\\\x22,\\n        \\\x22キティちゃんの正しい名前はハローキティではなく「キティ・ホワイト」\\\x22,\\n        \\\x22魔女の宅急便の少年トンボはあだ名。本名はコポリ\\\x22,\\n        \\\x22「アンパンマン」のチーズは元々バイキンマンの手下だった\\\x22,\\n        \\\x22クレヨンしんちゃんの父、野原ひろしの兄の名前は「野原せまし」\\\x22,\\n        \\\x22マリオの本名は「マリオ・マリオ」ルイージの本名は「ルイージ・マリオ」\\\x22,\\n        \\\x22マリオはあー見えてまだ26歳。ちなみに身長は155cm\\\x22,\\n        \\\x22サザエさんはあー見えてまだ24歳\\\x22,\\n        \\\x22タラちゃんには「ひとでちゃん」という妹がいる\\\x22,\\n        \\\x22波平の髪の毛は一本ではない\\\x22,\\n        \\\x22ドラえもんは3mm浮いている\\\x22,\\n        \\\x22アンパンマンのあんこは粒あん\\\x22,\\n        \\\x22古代オリンピックは8年周期で開催されていた\\\x22,\\n        \\\x22大相撲の行司は軍配を間違えた時に切腹するための刀を持っている\\\x22,\\n        \\\x22フィギュアスケートは元々、氷上を滑って描いた図形の正確さを競う競技だった\\\x22,\\n        \\\x22卓球のラケットは国際ルール上どんなに大きくても良いと決められている\\\x22,\\n        \\\x22人は約90分ごとに集中力が切れやすいといわれている。\\\x22,\\n        \\\x22テスト前は徹夜するより、しっかり寝た方が記憶は定着しやすい。\\\x22,\\n        \\\x22『やる気が出たら始める』より、『始めたらやる気が出る』ことの方が多い。\\\x22,\\n        \\\x22スマホの通知は見なくても集中力を下げる原因になることがある。\\\x22,\\n        \\\x22勉強は『読む』より『思い出す』練習をした方が記憶に残りやすい。\\\x22,\\n        \\\x22手書きでメモをすると、タイピングより内容を覚えやすいといわれている。\\\x22,\\n        \\\x22朝日を浴びると体内時計が整いやすくなる。\\\x22,\\n        \\\x2215〜20分ほどの昼寝は、午後の集中力アップにつながることがある。\\\x22,\\n        \\\x22緊張しているときほど、周りには意外と気づかれていないことが多い。\\\x22,\\n        \\\x22目標を紙に書くと、達成率が上がるという研究がある。\\\x22,\\n        \\\x22人は最初と最後に見聞きしたことを覚えやすい傾向がある。\\\x22,\\n        \\\x22歩きながら考えると、新しいアイデアが浮かびやすくなることがある。\\\x22,\\n        \\\x22人に教えるつもりで勉強すると、理解が深まりやすい。\\\x22,\\n        \\\x22青色には集中しやすいイメージを与える効果があるといわれている。\\\x22,\\n        \\\x22『まだできない』と考える人の方が成長しやすいという考え方がある。\\\x22,\\n        \\\x22笑顔を作るだけでも気分が前向きになりやすい。\\\x22,\\n        \\\x22人は『締め切り』がある方が行動しやすい傾向がある。\\\x22,\\n        \\\x22同じ内容でも、何回かに分けて勉強した方が覚えやすい。\\\x22,\\n        \\\x22好きな香りは気分転換につながることがある。\\\x22,\\n        \\\x22人は誰かに応援されると、本来の力を発揮しやすくなる。\\\x22,\\n        \\\x22SNSでは楽しい出来事の投稿が多く、実際の生活とは違って見えることがある。\\\x22,\\n        \\\x22人は選択肢が多すぎるとかえって決めにくくなる。\\\x22,\\n        \\\x22『ありがとう』を伝えることは、自分の幸福感にもつながるといわれている。\\\x22,\\n        \\\x22勉強場所を変えると気分が切り替わり、集中しやすくなることがある。\\\x22,\\n        \\\x22人は新しいことより、続けることの方が難しいといわれている。\\\x22,\\n        \\\x22運動すると脳への血流が増え、集中力アップにつながることがある。\\\x22,\\n        \\\x22好きな音楽でも、歌詞があると勉強に集中しにくい人もいる。\\\x22,\\n        \\\x22人は失敗したことの方が記憶に残りやすい傾向がある。\\\x22,\\n        \\\x22楽しい予定があるだけで気分が前向きになりやすい。\\\x22,\\n        \\\x22睡眠中に脳は記憶を整理していると考えられている。\\\x22,\\n        \\\x22『あと5分だけ』のスマホが30分以上になることは珍しくない。\\\x22,\\n        \\\x22第一印象は数秒で決まることが多いといわれている。\\\x22,\\n        \\\x22人は相手の名前を呼ぶだけで親近感を持ちやすい。\\\x22,\\n        \\\x22姿勢を正すと気分まで前向きになりやすいという研究がある。\\\x22,\\n        \\\x22一日5分の積み重ねでも、一年では30時間以上になる。\\\x22,\\n        \\\x22緊張したときは息を長く吐くと落ち着きやすい。\\\x22,\\n        \\\x22人は小さな成功を積み重ねると自信がつきやすい。\\\x22,\\n        \\\x22完璧を目指すより、まず終わらせる方が続けやすい。\\\x22,\\n        \\\x22復習は時間を空けて行う方が記憶に残りやすい。\\\x22,\\n        \\\x22人は『自分で選んだ』と思うとやる気が出やすい。\\\x22,\\n        \\\x22歩きながら暗記すると覚えやすくなる人もいる。\\\x22,\\n        \\\x22集中力が切れたら、立ち上がって少し体を動かすと気分転換になる。\\\x22,\\n        \\\x22水分不足は集中力の低下につながることがある。\\\x22,\\n        \\\x22人は楽しかった出来事ほど時間が短く感じやすい。\\\x22,\\n        \\\x22新しいことを始めるのに『遅すぎる』という明確な基準はない。\\\x22,\\n        \\\x22勉強した直後より、翌日に少し復習した方が覚えやすい。\\\x22,\\n        \\\x22笑いはストレスを和らげる効果があるといわれている。\\\x22,\\n        \\\x22友達と目標を共有すると継続しやすくなることがある。\\\x22,\\n        \\\x22『できるかどうか』より『やってみる』ことが成長につながる。\\\x22,\\n        \\\x22毎日の小さな習慣は、数か月後には大きな差になることがある。\\\x22,\\n        \\\x22人は相手の話を最後まで聞くだけで、『話しやすい人』という印象を持たれやすい。\\\x22,\\n        \\\x22パン食い競争は130年前からあった\\\x22,\\n        \\\x22サッカーの試合中、自分にレッドカードを出して退場した審判がいる\\\x22,\\n        \\\x22プロ野球の永遠のライバル巨人と阪神の応援歌は同じ作曲家が作った\\\x22,\\n        \\\x22カーリングのストーンは、スコットランドの１つの島でしか作れない\\\x22,\\n        \\\x22野球拳には全国大会がある\\\x22,\\n        \\\x22剣道の公式試合は二刀流でも出場できる\\\x22\\n\x5d,\\n        en: \x5b\\\x22The \x27H\x27 on a mechanical pencil lead stands for \x27Hard\x27, and \x27B\x27 stands for \x27Black\x27.\\\x22,\\n        \\\x22The most common school name in Japan is \x27Dai-ichi Elementary School\x27.\\\x22,\\n        \\\x22Blackboards are called \x27blackboards\x27 even though they are green because they were actually black boards in the past.\\\x22,\\n        \\\x22The proverb \x27Charity is not for others\x27 actually means \x27if you show kindness to others, it will eventually return to you as good fortune\x27.\\\x22,\\n        \\\x22The world\x27s first vending machine sold \x27holy water\x27.\\\x22,\\n        \\\x22Ice cream does not have an expiration date (because its quality rarely degrades when kept frozen).\\\x22,\\n        \\\x22Eating natto at night enhances its blood-thinning effects more than eating it in the morning.\\\x22,\\n        \\\x22Pouring natto over piping-hot rice reduces its nutritional benefits.\\\x22,\\n        \\\x22When brushing your teeth, it is better not to wet the toothbrush for a cleaner finish.\\\x22,\\n        \\\x22Curry stains on clothes can be removed simply by drying them in direct sunlight.\\\x22,\\n        \\\x22Eating cold rice makes you less likely to gain weight than eating hot rice.\\\x22,\\n        \\\x22Drinking a glass of water after meals can help suppress acid reflux.\\\x22,\\n        \\\x22If you have a sore throat, eating marshmallows can help soothe the pain.\\\x22,\\n        \\\x22Stopping your smartphone charge at around 80% instead of 100% helps extend battery lifespan.\\\x22,\\n        \\\x22Applying vinegar to bug bites can ease itching and inflammation.\\\x22,\\n        \\\x22If you can\x27t stop hiccuping, plugging both ears with your fingers often helps stop it.\\\x22,\\n        \\\x22Potato chips can be used as a substitute for fire starters.\\\x22,\\n        \\\x22When a headache won\x27t go away, warming your hands and feet can ease the symptoms.\\\x22,\\n        \\\x22For the same exercise, you burn more calories in winter than in summer.\\\x22,\\n        \\\x22When a baby won\x27t stop crying, playing Takashi Sorimachi\x27s song \x27POISON\x27 can make them stop.\\\x22,\\n        \\\x22When the series first began, Doraemon liked mochi (rice cakes) instead of dorayaki.\\\x22,\\n        \\\x22The blocks Mario breaks by jumping are actually citizens of the Mushroom Kingdom transformed by Bowser.\\\x22,\\n        \\\x22The ending theme song of Sazae-san uses the 3rd verse of the lyrics.\\\x22,\\n        \\\x22For 30 consecutive years, Sazae\x27s first New Year\x27s Jan-ken-pon move has been Scissors.\\\x22,\\n        \\\x22Gian\x27s famous line, \x27What\x27s yours is mine, and what\x27s mine is my own,\x27 is actually an English proverb.\\\x22,\\n        \\\x22Medama-oyaji (Eyeball Father) from GeGeGe no Kitaro sleeps with his eye closed.\\\x22,\\n        \\\x22Hello Kitty\x27s real full name is not Hello Kitty, but \x27Kitty White\x27.\\\x22,\\n        \\\x22The boy Tombo in Kiki\x27s Delivery Service is a nickname; his real name is Kopori.\\\x22,\\n        \\\x22Cheese the dog from Anpanman was originally a minion of Baikinman.\\\x22,\\n        \\\x22The name of Nohara Hiroshi\x27s older brother in Crayon Shin-chan is \x27Nohara Semashi\x27.\\\x22,\\n        \\\x22Mario\x27s full name is \x27Mario Mario\x27, and Luigi\x27s full name is \x27Luigi Mario\x27.\\\x22,\\n        \\\x22Despite his appearance, Mario is only 26 years old, and his height is 155 cm.\\\x22,\\n        \\\x22Despite her appearance, Sazae is only 24 years old.\\\x22,\\n        \\\x22Tara-chan has a younger sister named \x27Hitode-chan\x27.\\\x22,\\n        \\\x22Namihei does not have just a single hair on his head.\\\x22,\\n        \\\x22Doraemon floats 3 mm above the ground.\\\x22,\\n        \\\x22The sweet bean paste inside Anpanman\x27s head is coarse red bean paste (Tsubuan).\\\x22,\\n        \\\x22The ancient Olympics were held every 8 years.\\\x22,\\n        \\\x22Grand sumo referees (Gyoji) carry a dagger to commit ritual suicide (Seppuku) if they make a bad call.\\\x22,\\n        \\\x22Figure skating was originally a competition to accurately draw geometric patterns on ice while skating.\\\x22,\\n        \\\x22According to official international rules, a table tennis paddle can be any size without restriction.\\\x22,\\n        \\\x22It is said that human concentration tends to break down roughly every 90 minutes.\\\x22,\\n        \\\x22You retain memory better by getting a good night\x27s sleep before a test rather than pulling an all-nighter.\\\x22,\\n        \\\x22It is more common that \x27action creates motivation\x27 rather than \x27motivation creates action\x27.\\\x22,\\n        \\\x22Even if you don\x27t look at smartphone notifications, they can still cause your concentration to drop.\\\x22,\\n        \\\x22When studying, practicing \x27recalling\x27 information stays in memory better than simply \x27reading\x27.\\\x22,\\n        \\\x22Taking handwritten notes is said to make it easier to remember content compared to typing.\\\x22,\\n        \\\x22Soaking up morning sunlight makes it easier to reset and regulate your biological clock.\\\x22,\\n        \\\x22A short power nap of 15\\u201320 minutes can help boost afternoon concentration.\\\x22,\\n        \\\x22When you feel nervous, people around you rarely notice it as much as you think.\\\x22,\\n        \\\x22Research shows that writing down your goals increases the completion rate.\\\x22,\\n        \\\x22People tend to remember the first and last things they see or hear most easily.\\\x22,\\n        \\\x22Thinking while walking can sometimes make it easier to come up with new ideas.\\\x22,\\n        \\\x22Studying with the intention of teaching others makes it easier to deepen your understanding.\\\x22,\\n        \\\x22The color blue is said to have an effect that promotes focus and concentration.\\\x22,\\n        \\\x22There is a mindset that people who think \x27I can\x27t do it yet\x27 grow faster.\\\x22,\\n        \\\x22Just forming a smile can easily make your mood more positive.\\\x22,\\n        \\\x22People tend to take action more easily when there is a deadline.\\\x22,\\n        \\\x22Studying the same content spread out over multiple sessions makes it easier to remember.\\\x22,\\n        \\\x22Scents you like can help refresh your mood.\\\x22,\\n        \\\x22People tend to unleash their true potential more easily when cheered on by someone.\\\x22,\\n        \\\x22Posts on social media often feature happy events, making them look different from real life.\\\x22,\\n        \\\x22Having too many choices can actually make it harder for people to decide.\\\x22,\\n        \\\x22Expressing gratitude (\x27Thank you\x27) is said to boost one\x27s own sense of happiness.\\\x22,\\n        \\\x22Changing your study location can refresh your mood and make it easier to focus.\\\x22,\\n        \\\x22It is said that continuing a habit is harder for people than starting something new.\\\x22,\\n        \\\x22Exercise increases blood flow to the brain, which can lead to improved concentration.\\\x22,\\n        \\\x22Even if it is music you like, songs with lyrics can make it harder for some people to focus on studying.\\\x22,\\n        \\\x22People tend to remember their failures more vividly.\\\x22,\\n        \\\x22Just having fun plans scheduled can easily lift your mood.\\\x22,\\n        \\\x22It is believed that the brain organizes and consolidates memories during sleep.\\\x22,\\n        \\\x22Saying \x27just 5 more minutes\x27 on your phone turning into over 30 minutes is not uncommon.\\\x22,\\n        \\\x22First impressions are said to be formed within just a few seconds.\\\x22,\\n        \\\x22Simply calling someone by their name makes them feel more familiar and closer to you.\\\x22,\\n        \\\x22Studies show that correcting your posture can easily make your mood more positive.\\\x22,\\n        \\\x22Accumulating just 5 minutes a day adds up to over 30 hours in a year.\\\x22,\\n        \\\x22When you\x27re nervous, taking long exhales helps you calm down.\\\x22,\\n        \\\x22People build confidence more easily by accumulating small wins.\\\x22,\\n        \\\x22It is easier to maintain consistency by finishing a task rather than aiming for perfection.\\\x22,\\n        \\\x22Spaced-repetition review helps memories stick better than cramming.\\\x22,\\n        \\\x22People get motivated more easily when they feel they made a choice by themselves.\\\x22,\\n        \\\x22Some people find it easier to memorize things while walking.\\\x22,\\n        \\\x22When your concentration breaks, standing up and moving a bit serves as a great reset.\\\x22,\\n        \\\x22Lack of hydration can lead to a drop in concentration.\\\x22,\\n        \\\x22People tend to feel that time passes faster during enjoyable events.\\\x22,\\n        \\\x22There is no clear standard for when it is \x27too late\x27 to start something new.\\\x22,\\n        \\\x22Reviewing material a little bit the next day leads to better memory retention than reviewing immediately after studying.\\\x22,\\n        \\\x22Laughter is said to have the effect of relieving stress.\\\x22,\\n        \\\x22Sharing goals with friends can sometimes make it easier to stay consistent.\\\x22,\\n        \\\x22Focusing on \x27just giving it a try\x27 leads to growth more than worrying about \x27whether I can do it\x27.\\\x22,\\n        \\\x22Small daily habits can create a massive difference several months later.\\\x22,\\n        \\\x22Just listening to someone without interrupting gives them the impression that you are an \x27easy person to talk to\x27.\\\x22,\\n        \\\x22Bread-eating races existed as far back as 130 years ago.\\\x22,\\n        \\\x22There was a referee in a soccer match who issued a red card to himself and left the pitch.\\\x22,\\n        \\\x22The fight songs of rival Japanese baseball teams, the Giants and Tigers, were composed by the same person.\\\x22,\\n        \\\x22Curling stones can only be produced on a single island in Scotland.\\\x22,\\n        \\\x22There is a national tournament for Yakyu-ken (strip rock-paper-scissors).\\\x22,\\n        \\\x22Official Kendo matches allow contestants to compete using a two-sword style (Nito-ryu).\\\x22\\n\x5d,\\n        zh: \x5b\\\x22自動鉛筆芯的「H」代表 Hard（硬），「B」代表 Black（黑）。\\\x22,\\n        \\\x22日本最多的學校名稱是「第一小學校」。\\\x22,\\n        \\\x22黑板明明是綠色的卻叫「黑板」，是因為以前真的使用黑色的木板。\\\x22,\\n        \\\x22諺語「施惠不為人」（情けは人のためならず）的意思是「對人親切，善報最終會回到自己身上」。\\\x22,\\n        \\\x22世界上第一台自動販賣機販售的東西是「聖水」。\\\x22,\\n        \\\x22冰淇淋沒有保質期（因為在冷凍保存下品質不易變質）。\\\x22,\\n        \\\x22納豆在晚上吃比早上吃更能提升血液循環（清血）的效果。\\\x22,\\n        \\\x22把納豆放在熱騰騰的米飯上會降低納豆的營養效果。\\\x22,\\n        \\\x22刷牙時，牙刷不沾水能刷得更乾淨。\\\x22,\\n        \\\x22衣服上沾到的咖哩污漬，只要拿去曬太陽就能曬掉。\\\x22,\\n        \\\x22吃冷飯比吃熱飯更不容易發胖。\\\x22,\\n        \\\x22飯後喝一杯水可以抑制胃酸逆流。\\\x22,\\n        \\\x22喉嚨痛時吃棉花糖可以緩解疼痛。\\\x22,\\n        \\\x22手機充電不充到100%、維持在80%左右能延長電池壽命。\\\x22,\\n        \\\x22被蚊蟲叮咬時塗抹醋可以緩解癢感和發炎。\\\x22,\\n        \\\x22打嗝止不住時，用手指塞住雙耳比較容易止住。\\\x22,\\n        \\\x22洋芋片可以作為助燃劑使用。\\\x22,\\n        \\\x22頭痛一直好不了時，保暖手腳能讓症狀減輕。\\\x22,\\n        \\\x22做相同的運動，冬天比夏天消耗的卡路里更高。\\\x22,\\n        \\\x22嬰兒哭鬧不休時，播放反町隆史的《POISON》能讓他們停止哭泣。\\\x22,\\n        \\\x22連載初期，哆啦A夢喜歡的不是銅鑼燒而是年糕。\\\x22,\\n        \\\x22瑪利歐跳起來頂碎的磚塊，其實是被庫巴變成磚塊的蘑菇王國居民。\\\x22,\\n        \\\x22《海螺小姐》片尾曲使用的是第三段歌詞。\\\x22,\\n        \\\x22《海螺小姐》新年第一集的猜拳，連續30年都是出剪刀。\\\x22,\\n        \\\x22胖虎的名言「你的東西就是我的東西，我的東西還是我的東西」其實是一句英國諺語。\\\x22,\\n        \\\x22《鬼太郎》裡的眼珠老爹是閉著眼睛睡覺的。\\\x22,\\n        \\\x22Hello Kitty 的正式名字不是 Hello Kitty，而是「Kitty White」（凱蒂·懷特）。\\\x22,\\n        \\\x22《魔女宅急便》中的少年蜻蜓是暱稱，本名是「柯波利」（Kopori）。\\\x22,\\n        \\\x22《麵包超人》裡的起司（名犬起司）原本是細菌人的手下。\\\x22,\\n        \\\x22《蠟筆小新》中野原廣志的哥哥名字叫做「野原狹」（Nohara Semashi）。\\\x22,\\n        \\\x22瑪利歐的全名是「瑪利歐·瑪利歐」，路易吉的全名是「路易吉·瑪利歐」。\\\x22,\\n        \\\x22瑪利歐看似成熟但其實只有26歲，身高是155公分。\\\x22,\\n        \\\x22海螺小姐看似成熟但其實只有24歲。\\\x22,\\n        \\\x22鱈魚子（Tara-chan）有一個叫做「海星」（Hitode-chan）的妹妹。\\\x22,\\n        \\\x22波平（海螺小姐的父親）頭上的頭髮不只一根。\\\x22,\\n        \\\x22哆啦A夢平時是浮空3公釐運行的。\\\x22,\\n        \\\x22麵包超人頭裡的紅豆餡是帶皮紅豆粒餡（Tsubuan）。\\\x22,\\n        \\\x22古代奧林匹克運動會是以8年為週期舉辦的。\\\x22,\\n        \\\x22大相撲的行司（裁判）隨身攜帶短刀，是為了在判決錯誤時切腹謝罪。\\\x22,\\n        \\\x22花式滑冰最初是一項比拼在冰面上滑行所繪出圖形精確度的競技。\\\x22,\\n        \\\x22桌球拍在國際規則上，規定無論做多大都可以。\\\x22,\\n        \\\x22據說人類的專注力大約每90分鐘就容易中斷一次。\\\x22,\\n        \\\x22考試前與其熬夜，不如好好睡覺更能鞏固記憶。\\\x22,\\n        \\\x22與其「有了幹勁再開始」，更多時候是「開始做了才會產生幹勁」。\\\x22,\\n        \\\x22手機通知即使不去看，也可能會成為降低專注力的原因。\\\x22,\\n        \\\x22學習時，進行「回想」練習比單純「閱讀」更容易留下記憶。\\\x22,\\n        \\\x22用手寫做筆記據說比打字更容易記住內容。\\\x22,\\n        \\\x22曬曬早晨的太陽更容易調節生物鐘。\\\x22,\\n        \\\x2215〜20分鐘左右的午睡有助於提升下午的專注力。\\\x22,\\n        \\\x22越是緊張的時候，身邊的人其實越不容易察覺。\\\x22,\\n        \\\x22有研究顯示，把目標寫在紙上會提高達成率。\\\x22,\\n        \\\x22人更容易記住最先和最後看到或聽到的事物。\\\x22,\\n        \\\x22邊走邊思考有時更容易浮現新靈感。\\\x22,\\n        \\\x22以「要教給別人」的心態學習，更容易加深理解。\\\x22,\\n        \\\x22據說藍色具有給人容易集中精神的印象與效果。\\\x22,\\n        \\\x22有一種觀點認為，抱持著「我只是『還』不會」思考的人更容易成長。\\\x22,\\n        \\\x22光是做出笑臉，心情就更容易變得積極。\\\x22,\\n        \\\x22人在有「截止日期」時更容易採取行動。\\\x22,\\n        \\\x22同樣的內容，分成幾次分段學習更容易記住。\\\x22,\\n        \\\x22喜歡的香氣有助於轉換心情。\\\x22,\\n        \\\x22人在得到他人加油打氣時，更容易發揮出原本的實力。\\\x22,\\n        \\\x22社群媒體上記錄的多是快樂的事，看起來常與真實生活有所不同。\\\x22,\\n        \\\x22選項太多時，人反而更難做決定。\\\x22,\\n        \\\x22傳達「謝謝」據說也有助於提升自己的幸福感。\\\x22,\\n        \\\x22改變學習地點可以轉換心情，更容易集中精神。\\\x22,\\n        \\\x22據說比起開始做新事物，堅持下去對人來說更難。\\\x22,\\n        \\\x22運動會增加大腦的血流量，有助於提升專注力。\\\x22,\\n        \\\x22即使是喜歡的音樂，如果有歌詞的話，有些人也會難以集中精力學習。\\\x22,\\n        \\\x22人往往更容易記住失敗的事情。\\\x22,\\n        \\\x22光是有了令人期待的計畫，心情就更容易變得積極。\\\x22,\\n        \\\x22普遍認為大腦會在睡眠中整理和鞏固記憶。\\\x22,\\n        \\\x22說著「再看5分鐘」手機，最後超過30分鐘的情況並不罕見。\\\x22,\\n        \\\x22據說第一印象往往在幾秒鐘之內就決定了。\\\x22,\\n        \\\x22光是呼喚對方的名字，人就更容易產生親切感。\\\x22,\\n        \\\x22研究顯示，端正姿勢能讓心情也隨之變得積極。\\\x22,\\n        \\\x22每天積累5分鐘，一年下來就會超過30個小時。\\\x22,\\n        \\\x22緊張時長長地吐氣更容易冷靜下來。\\\x22,\\n        \\\x22人更容易透過積累小成功來建立自信。\\\x22,\\n        \\\x22與其追求完美，先完成目標更容易堅持下去。\\\x22,\\n        \\\x22拉開時間間隔進行複習更容易留下記憶。\\\x22,\\n        \\\x22人在認為是「自己選擇」的時候更容易產生動力。\\\x22,\\n        \\\x22有些人邊走邊背誦更容易記住。\\\x22,\\n        \\\x22專注力中斷時，站起來動一動身體能很好地轉換心情。\\\x22,\\n        \\\x22水分不足可能會導致專注力下降。\\\x22,\\n        \\\x22越是快樂的事情，人越容易覺得時間過得很快。\\\x22,\\n        \\\x22對於開始嘗試新事物，並沒有所謂「太遲」的明確標準。\\\x22,\\n        \\\x22比起剛學完馬上複習，隔天稍加複習更容易記住。\\\x22,\\n        \\\x22據說歡笑具有舒緩壓力的效果。\\\x22,\\n        \\\x22和朋友分享目標，有時能更容易堅持下去。\\\x22,\\n        \\\x22比起糾結「能不能做到」，先「試著做做看」更能帶來成長。\\\x22,\\n        \\\x22每天的小習慣，在幾個月後可能會帶來巨大的差距。\\\x22,\\n        \\\x22光是耐心把對方的話聽完，就容易給人留下「很好溝通\/說話」的印象。\\\x22,\\n        \\\x22叼麵包競走早在130年前就已經存在了。\\\x22,\\n        \\\x22在足球比賽中，曾有裁判向自己出示紅牌並退場。\\\x22,\\n        \\\x22日本職棒宿敵「巨人」與「阪神」的應援歌是由同一位作曲家創作的。\\\x22,\\n        \\\x22冰壺運動用的冰壺石只能在蘇格蘭的一個島嶼上製造。\\\x22,\\n        \\\x22棒球拳（猜拳遊戲）設有全國大賽。\\\x22,\\n        \\\x22劍道的正式比賽中，選手是可以持「二刀流」參賽的。\\\x22\\n\x5d\\n    \x7d;\\n\\n    const bingoData \x3d \x7b\\n        ja: \x5b\\\x22授業中に寝た人を見た\\\x22,\\n                    \\\x22先生が雑談を始めた\\\x22,\\n                    \\\x22チャイムギリギリで登校\\\x22,\\n                    \\\x22購買でお目当てが売り切れ\\\x22,\\n                    \\\x22提出物の期限を忘れる\\\x22,\\n                    \\\x22スマホが鳴ってヒヤッとした\\\x22,\\n                    \\\x22宿題やったけど家に忘れた\\\x22,\\n                    \\\x22次の教室が分からなくなる\\\x22,\\n                    \\\x22なんでもできる超人なクラスメートがいる\\\x22,\\n                    \\\x22常にスマホの画面バキバキ\\\x22,\\n                    \\\x22先生のモノマネがプロ級に上手な人\\\x22,\\n                    \\\x22授業中、独り言が大きい人\\\x22,\\n                    \\\x22誰とでも仲良くなれるコミュ力の塊な人\\\x22,\\n                    \\\x22前髪のセットに命をかけている人\\\x22,\\n                    \\\x22カバンが見えないくらいキーホルダーが多い人\\\x22,\\n                    \\\x22テスト前に「勉強してない」\\\x22,\\n                    \\\x22何回も同じ数字がきて不安になる\\\x22,\\n                    \\\x22月曜日、朝から「早く週末にならないかな」と口にしがち\\\x22, \\n                    \\\x22テスト前日に部屋の大掃除を始めてしまう\\\x22, \\n                    \\\x22授業中、1回も目を合わせないように先生の動きを監視する\\\x22, \\n                    \\\x22席替えで窓際の1番後ろの席になったときの無敵感\\\x22, \\n                    \\\x22金曜日の放課後の解放感が異常に高い\\\x22,\\n                    \\\x22黒板をスマホで写真撮るだけで勉強した気になってしまう\\\x22, \\n                    \\\x22イヤホンの片方を友達に貸して音楽を聴くシチュエーションに憧れる\\\x22, \\n                    \\\x22提出物、友達に見せてもらいながら写すときの驚異的な集中力\\\x22, \\n                    \\\x22テスト中、残り時間あと5分のチャイムで急に焦り出す\\\x22, \\n                    \\\x22「次の時間、自習だって！」という噂の広まり方の速さ\\\x22, \\n                    \\\x22雨の日の自転車通学が修行レベルでキツい\\\x22,\\n                    \\\x22学校でもらうプリントが多すぎてカバンの底でぐしゃぐしゃになる\\\x22, \\n                    \\\x22体育の授業の後、教室が制汗剤の匂いで満たされる\\\x22,\\n                    \\\x22先生のちょっとしたプライベートを詮索しがち\\\x22, \\n                    \\\x22お弁当を開けた瞬間に友達からおかずを奪われそうになる\\\x22, \\n                    \\\x22「今日の時間割、何だっけ？」を1日に3回は聞く\\\x22, \\n                    \\\x22テストの点数を隠しながら「何点だった？」と聞き合う\\\x22, \\n                    \\\x22冬の制服の上に着るマフラーの着こなしにこだわる\\\x22, \\n                    \\\x22「今日の先生、機嫌悪くない？」とクラスで情報共有される\\\x22, \\n                    \\\x22シャーペンの芯が切れて、隣の人に「芯1本ちょうだい」と頼む\\\x22,\\n                    \\\x22学年集会で校長先生の話が長すぎて、みんなの意識が遠のく\\\x22, \\n                    \\\x22「この教科、将来何に使うんだろう\\u2026」と授業中にふと考えてしまう\\\x22, \\n                    \\\x22土日の部活が朝早すぎて、平日の登校時間より早い\\\x22, \\n                    \\\x22長期休みが終わる直前に「まだ宿題半分も終わってない」と大騒ぎする\\\x22,\\n                    \\\x22クラスに1人は、どんな天気でも毎日半袖の元気なやつがいる\\\x22,\\n                    \\\x22朝のバスや電車が遅れて遅延証明書をもらいがち\\\x22, \\n                    \\\x22「〜ちゃん」「〜けん」を無意識に使いすぎて他県民に驚かれる\\\x22,\\n                    \\\x22体育祭の「ブロック」にかける熱量が日本一高い\\\x22,\\n                    \\\x22「ちかっぱ」を使いこなしクラスに一人いる\\\x22, \\n                    \\\x22「なおす（片付ける）」が標準語だと思っていて他県で通じず焦る\\\x22, \\n                    \\\x22「からう（背負う）」が方言だと知ったときの衝撃\\\x22,\\n                    \\\x22チャリ通（自転車通学）の坂道が急すぎて毎朝がトレーニング\\\x22, \\n                    \\\x22「さん、はい」ではなく「さんのーがーはい」でタイミングを合わせる\\\x22, \\n                    \\\x22「はわく（掃く）」という言葉が掃除の時間に飛び交う\\\x22\\n\x5d,\\n        en: \x5b\\\x22Saw someone sleeping in class\\\x22,\\n                    \\\x22Teacher started making small talk\\\x22,\\n                    \\\x22Arrived at school just before the chime\\\x22,\\n                    \\\x22My target item was sold out at the school shop\\\x22,\\n                    \\\x22Forgot the deadline for an assignment\\\x22,\\n                    \\\x22My heart skipped a beat when a phone went off\\\x22,\\n                    \\\x22Did the homework but left it at home\\\x22,\\n                    \\\x22Got lost trying to find the next classroom\\\x22,\\n                    \\\x22There is an all-rounder super student in class\\\x22,\\n                    \\\
